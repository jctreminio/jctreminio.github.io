<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TA Sessions</title>
<style>
  :root {
    --bg: #fafaf9;
    --card: #ffffff;
    --text: #1c1917;
    --muted: #78716c;
    --border: #e7e5e4;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --card: #292524;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --border: #44403c;
      --accent: #60a5fa;
      --accent-soft: #1e293b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 48px 16px 64px; }
  header h1 { margin: 0 0 8px; font-size: 2rem; }
  header p { margin: 0; color: var(--muted); }
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 8px; }
  nav a {
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
    color: var(--text); text-decoration: none; font-size: 0.9rem; background: var(--card);
  }
  nav a:hover { border-color: var(--accent); color: var(--accent); }
  section { margin-top: 40px; }
  h2 { font-size: 1.3rem; margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .item h3 { margin: 0; font-size: 1rem; }
  .item .meta { color: var(--muted); font-size: 0.85rem; margin: 2px 0 0; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    font-size: 0.85rem; padding: 5px 12px; border-radius: 6px; text-decoration: none;
    background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.off { color: var(--muted); background: transparent; border: 1px dashed var(--border); cursor: default; }
  .empty { color: var(--muted); font-style: italic; }
  footer { margin-top: 56px; color: var(--muted); font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>TA Sessions</h1>
    <p>Exercises, solutions and supporting materials.</p>
  </header>

  <nav>
    <a href="#sessions">TA Sessions</a>
    <a href="#materials">Materials</a>
  </nav>

  <section id="sessions">
    <h2>TA Sessions</h2>
    <div id="lista-sesiones"></div>
  </section>

  <section id="materials">
    <h2>Materials</h2>
    <div id="lista-material"></div>
  </section>

  <footer>Last updated: <span id="fecha"></span></footer>
</div>

<script>
/* =====================================================================
   AQUÍ AÑADES TU CONTENIDO
   - Cada sesión es una línea { ... }. Para añadir otra, copia la línea,
     pégala debajo y cambia los textos. Coma al final de cada línea.
   - Escribe el nombre EXACTO del PDF (mayúsculas incluidas).
   - Si algo aún no está listo, déjalo vacío: ""  (saldrá "coming soon")
   ===================================================================== */

const sesiones = [
  { titulo: "TA Session 1", descripcion: "Exercises 8, 9 and 4.10", teoria: "TA_Session_I_Theory_Handout.pdf", ejercicios: "TA_Session_I_Exercises_8_9_4_10.pdf", soluciones: "" },
];

const material = [
];

const ultimaActualizacion = "November 8, 2026";

/* ===================== No hace falta tocar lo de abajo ===================== */

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function boton(texto, url) {
  return url
    ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${texto}</a>`
    : `<span class="btn off">${texto} (coming soon)</span>`;
}
function tarjeta(titulo, descripcion, botones) {
  return `<div class="item">
    <div><h3>${esc(titulo)}</h3>${descripcion ? `<p class="meta">${esc(descripcion)}</p>` : ""}</div>
    <div class="links">${botones}</div>
  </div>`;
}

document.getElementById("lista-sesiones").innerHTML = sesiones.length
  ? sesiones.map(s => tarjeta(s.titulo, s.descripcion,
      boton("Theory handout", s.teoria) + boton("Exercises", s.ejercicios) + boton("Solutions", s.soluciones))).join("")
  : `<p class="empty">No sessions yet.</p>`;

document.getElementById("lista-material").innerHTML = material.length
  ? material.map(m => tarjeta(m.titulo, m.descripcion, boton("Open", m.enlace))).join("")
  : `<p class="empty">No materials yet.</p>`;

document.getElementById("fecha").textContent = ultimaActualizacion;
</script>
</body>
</html>
