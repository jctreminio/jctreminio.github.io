<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercises and Materials</title>
<style>
  :root {
    --bg: #fafaf9;
    --card: #ffffff;
    --text: #1c1917;
    --muted: #78716c;
    --border: #e7e5e4;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --card: #292524;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --border: #44403c;
      --accent: #60a5fa;
      --accent-soft: #1e293b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 48px 16px 64px; }
  header h1 { margin: 0 0 8px; font-size: 2rem; }
  header p { margin: 0; color: var(--muted); }
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 8px; }
  nav a {
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
    color: var(--text); text-decoration: none; font-size: 0.9rem; background: var(--card);
  }
  nav a:hover { border-color: var(--accent); color: var(--accent); }
  section { margin-top: 40px; }
  h2 { font-size: 1.3rem; margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .item h3 { margin: 0; font-size: 1rem; }
  .item .meta { color: var(--muted); font-size: 0.85rem; margin: 2px 0 0; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    font-size: 0.85rem; padding: 5px 12px; border-radius: 6px; text-decoration: none;
    background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.off { color: var(--muted); background: transparent; border: 1px dashed var(--border); cursor: default; }
  .empty { color: var(--muted); font-style: italic; }
  footer { margin-top: 56px; color: var(--muted); font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ====== CABECERA: cambia el título y la descripción ====== -->
  <header>
    <h1>Exercises and Materials</h1>
    <p>A collection of exercises, solutions and supporting materials.</p>
  </header>

  <nav>
    <a href="#ejercicios">Exercises</a>
    <a href="#material">Materials</a>
  </nav>

  <section id="ejercicios">
    <h2>Exercises and Solutions</h2>
    <div id="lista-ejercicios"></div>
  </section>

  <section id="material">
    <h2>Materials</h2>
    <div id="lista-material"></div>
  </section>

  <footer>Last updated: <span id="fecha"></span></footer>
</div>

<script>
/* =====================================================================
   AQUÍ AÑADES TU CONTENIDO
   - Para añadir algo nuevo, copia una línea { ... }, pégala debajo y
     cambia los textos. No olvides la coma al final de cada línea.
   - Los enlaces apuntan a archivos que subas al repositorio
     (por ejemplo, a la carpeta "ejercicios/"), o a cualquier URL.
   - Si una solución aún no está lista, pon:  solucion: ""
   ===================================================================== */

const ejercicios = [
  { titulo: "Exercise 1", descripcion: "Topic or short description", enunciado: "ejercicios/ejercicio1.pdf", solucion: "soluciones/solucion1.pdf" },
  { titulo: "Exercise 2", descripcion: "Topic or short description", enunciado: "ejercicios/ejercicio2.pdf", solucion: "" },
];

const material = [
  { titulo: "Lecture notes, topic 1", descripcion: "Summary of key concepts", enlace: "material/apuntes1.pdf" },
];

const ultimaActualizacion = "November 8, 2026";

/* ===================== No hace falta tocar lo de abajo ===================== */

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function boton(texto, url) {
  return url
    ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${texto}</a>`
    : `<span class="btn off">${texto} (coming soon)</span>`;
}
function tarjeta(titulo, descripcion, botones) {
  return `<div class="item">
    <div><h3>${esc(titulo)}</h3>${descripcion ? `<p class="meta">${esc(descripcion)}</p>` : ""}</div>
    <div class="links">${botones}</div>
  </div>`;
}

document.getElementById("lista-ejercicios").innerHTML = ejercicios.length
  ? ejercicios.map(e => tarjeta(e.titulo, e.descripcion, boton("Problem", e.enunciado) + boton("Solution", e.solucion))).join("")
  : `<p class="empty">No exercises yet.</p>`;

document.getElementById("lista-material").innerHTML = material.length
  ? material.map(m => tarjeta(m.titulo, m.descripcion, boton("Open", m.enlace))).join("")
  : `<p class="empty">No materials yet.</p>`;

document.getElementById("fecha").textContent = ultimaActualizacion;
</script>
</body>
</html>
